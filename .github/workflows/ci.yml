name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: closecall_client
      - run: dart pub get
        working-directory: closecall_shared
      - run: dart pub get
        working-directory: closecall_server
      - run: dart run scripts/bootstrap_serverpod.dart
      - run: PUB_CACHE="$PWD/.tooling/pub-cache" dart pub global activate serverpod_cli 4.0.3
      - run: dart run tool/generate.dart --check
        working-directory: closecall_server
      - run: flutter analyze
      - run: flutter test
      - run: dart analyze
        working-directory: closecall_client
      - run: dart analyze
        working-directory: closecall_shared
      - run: dart analyze
        working-directory: closecall_server
      - run: dart test -j 1
        working-directory: closecall_server
      - run: dart test
        working-directory: closecall_shared
