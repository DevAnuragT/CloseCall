class: WidgetDeviceCredentialRecord
table: closecall_widget_device_credential
serverOnly: true
# Only a SHA-256 digest is persisted. The composite same-couple FK and
# digest/device/expiry CHECKs are added by the migration/schema extension.
fields:
  coupleId: UuidValue, relation(parent=closecall_couple, onDelete=Cascade)
  memberId: int, relation(parent=closecall_couple_member, onDelete=Cascade)
  userIdentifier: String
  deviceId: String
  credentialHash: String
  createdAt: DateTime
  expiresAt: DateTime
indexes:
  closecall_widget_credential_hash_unique:
    fields: credentialHash
    unique: true
  closecall_widget_credential_member_device_unique:
    fields: memberId, deviceId
    unique: true
  closecall_widget_credential_user_device_unique:
    fields: userIdentifier, deviceId
    unique: true
