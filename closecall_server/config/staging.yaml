# Supply real external hosts here or through SERVERPOD_* configuration overrides.
# No dataPath: staging must use managed/external PostgreSQL.
apiServer:
  port: 8080
  publicHost: api.staging.closecall.invalid
  publicPort: 443
  publicScheme: https
insightsServer:
  port: 8081
  publicHost: insights.staging.closecall.invalid
  publicPort: 443
  publicScheme: https
database:
  host: database.staging.closecall.invalid
  port: 5432
  name: closecall_staging
  user: closecall
  requireSsl: true
sessionLogs:
  persistentEnabled: false
  consoleEnabled: true
maxRequestSize: 4194304
